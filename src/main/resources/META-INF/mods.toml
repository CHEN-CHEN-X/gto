# GregTech Odyssey Menu 模组元数据
# 注意：本文件经过 Gradle 的 expand() 模板处理，美元符号加花括号形式的变量会被当作 Groovy 插值，
#       因此注释中不要出现该形式的文本；变量值在构建时由 gradle.properties 注入
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

Features:
- GLSL black hole shader background (self-rendered, no FancyMenu dependency)
- 14-tier voltage block orbital animation
- Three-color system (cyan/magenta/warm white)
- Schwarzschild ray-traced accretion disk
- Gravitational lensing & photon ring
'''

# Mixin 配置：拦截 TitleScreen 渲染，替换全景图为黑洞着色器
[[mixins]]
    config = "gto_menu.mixins.json"

# 依赖 Forge（仅客户端，主题只在主菜单生效）
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

# 依赖 Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# FancyMenu 仅作可选组件：若存在则负责按钮/标题排版，不存在也不影响黑洞背景渲染
[[dependencies.${mod_id}]]
    modId="fancymenu"
    mandatory=false
    versionRange="[3.9.6,)"
    ordering="NONE"
    side="CLIENT"
