# GregTech Odyssey Menu 模组元数据
# 注意：本文件经过 Gradle 的 expand() 模板处理，美元符号加花括号形式的变量会被当作 Groovy 插值，
#       因此注释中不要出现该形式的文本；变量值在构建时由 gradle.properties 注入
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

Features:
- Forge screen events for the title-screen effect
- Reference-derived animated binary orbits and a black-hole background
- Uses installed GTOCore and GTCEu hermetic casing models
'''

# 依赖 Forge（仅客户端，主题只在主菜单生效）
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

# 依赖 Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Real casing models are provided by the installed mods, not bundled textures.
[[dependencies.${mod_id}]]
    modId="gtceu"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="gtocore"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"
